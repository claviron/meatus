[package]
name = "meatus"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "An Orbit-connected VPN service powered by Quincy"
repository = "https://github.com/claviron/meatus"
authors = ["ilker Arabaci <iadev09@claviron.dev>"]
keywords = ["vpn", "quic", "tun", "network", "ipc"]
categories = ["network-programming", "command-line-utilities"]
publish = true
autotests = false

[workspace]
members = ["."]
resolver = "3"

[dependencies]
scutum-management = { version = "0.2.0", default-features = false }
claviron = { version = "0.2.0-alpha.22", default-features = false, features = ["server"] }
quincy = { package = "quincy-forked", version = "0.0.1", default-features = false }
quincy-server = { package = "quincy-server-forked", version = "0.0.1", default-features = false }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
ipnet = "2"
tokio = { version = "1", features = ["test-util"] }
