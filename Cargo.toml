[package]
name = "meatus"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "An Orbit-connected VPN service powered by Quincy"
repository = "https://github.com/claviron/meatus"
publish = false
autotests = false

[workspace]
members = ["."]
resolver = "3"

[dependencies]
scutum-management = { path = "../scutum/crates/management", version = "0.1.0", default-features = false }
claviron = { path = "../claviron", version = "0.2.0-alpha.20", default-features = false, features = ["server"] }
# Development checks select the prepared Quincy source with command-local patches.
quincy = { version = "3.1.0", default-features = false }
quincy-server = { version = "3.1.0", default-features = false }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
ipnet = "2"
tokio = { version = "1", features = ["test-util"] }
